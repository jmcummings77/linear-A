name: Matrix ports

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Collect a quick comparison report and available stack profiles
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: matrix-ports-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*packages.lock.json'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.10'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: aarch64
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Test C# library
        run: |
          dotnet restore --locked-mode
          dotnet test --configuration Release --no-restore
      - name: Test F# library
        run: dotnet fsi ports/fsharp/tests.fsx
      - name: Test Rust library and runner
        run: cargo test --locked --manifest-path ports/rust/Cargo.toml
      - name: Test Go library and runner
        working-directory: ports/go
        run: go test ./...
      - name: Test TypeScript library and runner
        run: |
          npm --prefix ports/typescript ci --ignore-scripts
          npm --prefix ports/typescript test
      - name: Test Python library and runner
        run: python3 -m unittest discover -s ports/python -p 'test_*.py'
      - name: Build and test WebAssembly library, runner, and live worker
        run: |
          python3 ports/wasm/build.py --output .build/wasm
          python3 ports/wasm/build.py --trace --output .build/wasm-trace
          node --test ports/wasm/*.test.mjs
          python3 applications/build.py
      - name: Test benchmark harness and profile parsers
        run: |
          python3 -m unittest discover -s tests/benchmark_harness -v
          node --test tests/ordering-report.test.mjs tests/sparse-report.test.mjs tests/report-theme.test.mjs tests/timing-report.test.mjs tests/geometry-report.test.mjs tests/accuracy-report.test.mjs tests/comparison.test.mjs tests/comparison-ui.test.mjs
      - name: Test Julia library and runner
        run: julia --startup-file=no --threads=1 --project=ports/julia ports/julia/test/runtests.jl
      - name: Test C, C++, and ARM64 libraries
        run: |
          mkdir -p .build/unit
          clang -std=c11 -O3 -g -ffp-contract=off ports/c/matrix.c ports/c/tests.c -lm -o .build/unit/c-tests
          .build/unit/c-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/svd_tests.c -lm -o .build/unit/svd-tests
          .build/unit/svd-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/test_sparse.c -lm -o .build/unit/sparse-tests
          .build/unit/sparse-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/test_gmres.c -lm -o .build/unit/gmres-tests
          .build/unit/gmres-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/test_ilu.c -lm -o .build/unit/ilu-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/test_ordering.c -lm -o .build/unit/ordering-tests
          .build/unit/ordering-tests
          .build/unit/ilu-tests
          clang -std=c11 -O1 -g -ffp-contract=off -fsanitize=address,undefined -fno-sanitize-recover=all ports/c/matrix.c ports/c/pseudoinverse_tests.c -lm -o .build/unit/pseudoinverse-tests
          .build/unit/pseudoinverse-tests
          clang++ -std=c++17 -O3 -g -ffp-contract=off ports/cpp/tests.cpp -o .build/unit/cpp-tests
          .build/unit/cpp-tests
          clang -std=c11 -O3 -g -ffp-contract=off -DMATRIX_USE_ASM ports/c/matrix.c ports/assembly/tests.c ports/assembly/kernels.S -lm -o .build/unit/assembly-tests
          .build/unit/assembly-tests
      - name: Verify multiplication locality kernels with sanitizers
        run: python3 experiments/matmul-locality/run.py --verify-only --sanitize
      - name: Build and verify all eleven runners
        run: python3 benchmarks/run.py --verify-only --require-all --output benchmarks/reports/verification
      - name: Verify CSR and conjugate gradient across all eleven ports
        run: python3 benchmarks/sparse.py --no-build --verify-only --require-all
      - name: Check generated numerical properties across all eleven ports
        run: python3 benchmarks/bugfinding.py --no-build --seeds 2
      - name: Upload generated-case diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-cases-${{ runner.arch }}
          path: .build/bugfinding/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify determinant algorithms on general and SPD inputs
        run: python3 benchmarks/determinants.py --no-build --verify-only --require-all --output benchmarks/reports/determinant-verification
      - name: Test release metadata and archive boundaries
        run: python3 -m unittest discover -s tests/release -v
      - name: Build packages and test isolated consumers
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 release/build.py --output .build/release-assets --tag "$GITHUB_REF_NAME"
          else
            python3 release/build.py --output .build/release-assets
          fi
      - name: Upload verified release kits
        uses: actions/upload-artifact@v7
        with:
          name: release-kits-${{ runner.arch }}
          path: .build/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Check C# benchmark adapter formatting
        run: dotnet format benchmarks/dotnet/Runner.csproj --verify-no-changes --no-restore
      - name: Collect optional quick performance report
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        run: python3 benchmarks/run.py --no-build --suite quick --profiles --require-all --output benchmarks/reports/quick
      - name: Upload verification and comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-ports-${{ runner.arch }}
          path: benchmarks/reports/
          if-no-files-found: warn
          retention-days: 14

  native-fuzz:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang with libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-rt-dev
      - name: Fuzz native C and ARM64 interfaces with sanitizers
        run: |
          python3 tests/fuzz/run.py --runs 10000
          python3 tests/fuzz/run.py --assembly --runs 10000
      - name: Preserve generated crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-fuzz-inputs
          path: |
            .build/fuzz/crash-*
            .build/fuzz/timeout-*
            .build/fuzz/oom-*
          if-no-files-found: ignore
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, native-fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-kits-ARM64
          path: release-assets
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "linear-A $RELEASE_TAG" --notes "Source kits and verified consumer packages for all eleven implementations. See release.json for revision and checksums, and the versioned API documentation inside each source kit." ./*
