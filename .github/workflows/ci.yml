name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate recorded benchmark provenance
        run: python3 benchmarks/check_provenance.py
      - name: Test benchmark source capture and publication gate
        run: |
          python3 -m unittest discover -s tests/benchmark_harness -p 'test_provenance_gate.py' -v
          python3 -m unittest discover -s tests/benchmark_harness -p 'test_reproduce.py' -v
          python3 -m unittest discover -s tests/benchmark_harness -p 'test_catalog_provenance.py' -v
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Restore .NET Standard smoke runner
        run: dotnet restore tests/NetStandardSmoke/NetStandardSmoke.csproj --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
      - name: Exercise .NET Standard library
        run: dotnet run --project tests/NetStandardSmoke/NetStandardSmoke.csproj --configuration Release --no-restore
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          dotnet format --verify-no-changes --no-restore
          dotnet format tests/NetStandardSmoke/NetStandardSmoke.csproj --verify-no-changes --no-restore
